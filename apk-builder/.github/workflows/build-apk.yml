name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'apk-builder/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (platform 34 + build-tools)
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          cmake: none
          ndk: none

      - name: Set up Gradle 8.7
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.7
          build-root-directory: apk-builder

      - name: Build debug APK
        run: |
          set -e
          SDK="${ANDROID_HOME:-$HOME/android-sdk}"
          echo "sdk.dir=$SDK" > apk-builder/local.properties
          cd apk-builder
          gradle assembleDebug --no-daemon --stacktrace

      - name: Copy APK to workspace root
        run: cp apk-builder/app/build/outputs/apk/debug/app-debug.apk food-tracker.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: food-tracker-apk
          path: food-tracker.apk
          retention-days: 30
          if-no-files-found: error
